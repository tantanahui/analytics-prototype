<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>埋点事件分析平台 · 原型</title>
<style>
/* ============ 基础 ============ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  color: #1f2329;
  background: #f4f6fa;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #d3d8e0; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: #2f6bff; text-decoration: none; }

/* ============ 布局 ============ */
.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: 216px; flex: 0 0 216px;
  background: #fff;
  border-right: 1px solid #e8ebf0;
  display: flex; flex-direction: column;
}
.logo {
  height: 56px; display: flex; align-items: center; gap: 9px;
  padding: 0 16px; border-bottom: 1px solid #f0f2f5;
}
.logo-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, #2f6bff, #6f9bff);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px;
}
.logo-text { font-size: 14px; font-weight: 600; letter-spacing: .3px; }
.logo-sub { font-size: 11px; color: #8f959e; margin-top: 1px; }

.nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav-group-title {
  font-size: 11px; color: #a5abb5; padding: 12px 10px 6px;
  letter-spacing: .5px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  color: #4e5969; font-size: 13px; margin-bottom: 2px;
  transition: background .15s;
}
.nav-item:hover { background: #f5f7fa; }
.nav-item.active { background: #eef3ff; color: #2f6bff; font-weight: 600; }
.nav-item .ico { width: 16px; height: 16px; flex: 0 0 16px; opacity: .9; }
.nav-badge {
  margin-left: auto; font-size: 10px; background: #fff1f0; color: #f54a45;
  padding: 1px 5px; border-radius: 8px; border: 1px solid #ffccc7;
}

.sidebar-footer {
  padding: 10px 14px; border-top: 1px solid #f0f2f5;
  font-size: 11px; color: #a5abb5; display: flex; align-items: center; gap: 8px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #17b26a; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: 56px; flex: 0 0 56px; background: #fff;
  border-bottom: 1px solid #e8ebf0;
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
}
.crumb { font-size: 15px; font-weight: 600; }
.crumb small { font-size: 12px; color: #8f959e; font-weight: 400; margin-left: 8px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.content { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }

/* ============ 控件 ============ */
.btn {
  height: 30px; padding: 0 12px; border: 1px solid #d9dde3; background: #fff;
  border-radius: 6px; font-size: 12px; color: #4e5969; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: #2f6bff; color: #2f6bff; }
.btn.primary { background: #2f6bff; border-color: #2f6bff; color: #fff; }
.btn.primary:hover { background: #1f57e6; color: #fff; }
.btn.ghost { border-color: transparent; background: #f4f6fa; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }

.select {
  height: 30px; border: 1px solid #d9dde3; border-radius: 6px; background: #fff;
  padding: 0 26px 0 10px; font-size: 12px; color: #1f2329; cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%238f959e' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center;
}
.input {
  height: 30px; border: 1px solid #d9dde3; border-radius: 6px; padding: 0 10px;
  font-size: 12px; width: 200px; outline: none;
}
.input:focus { border-color: #2f6bff; }

.seg { display: inline-flex; background: #f4f6fa; border-radius: 6px; padding: 2px; }
.seg button {
  border: none; background: transparent; height: 26px; padding: 0 12px;
  font-size: 12px; color: #4e5969; cursor: pointer; border-radius: 5px;
}
.seg button.active { background: #fff; color: #2f6bff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
  background: #f4f6fa; color: #646a73; border: 1px solid #e8ebf0;
}
.tag.blue { background: #eef3ff; color: #2f6bff; border-color: #d6e2ff; }
.tag.green { background: #eafaf1; color: #17b26a; border-color: #c6ecd8; }
.tag.orange { background: #fff7e8; color: #d9820b; border-color: #ffe0ab; }
.tag.red { background: #fff1f0; color: #f54a45; border-color: #ffccc7; }
.tag.purple { background: #f4efff; color: #7a4ddd; border-color: #e2d6fb; }

.up { color: #f54a45; }   /* 涨：红 */
.down { color: #17b26a; } /* 跌：绿 */

/* ============ 卡片 ============ */
.card {
  background: #fff; border: 1px solid #e8ebf0; border-radius: 8px;
  margin-bottom: 16px;
}
.card-head {
  height: 46px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid #f0f2f5;
}
.card-title { font-size: 14px; font-weight: 600; }
.card-title small { font-weight: 400; color: #8f959e; font-size: 12px; margin-left: 8px; }
.card-head .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }
.card-body.tight { padding: 10px 16px 14px; }

.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }

/* ============ KPI ============ */
.kpi {
  background: #fff; border: 1px solid #e8ebf0; border-radius: 8px; padding: 14px 16px;
  position: relative; overflow: hidden;
}
.kpi .label { font-size: 12px; color: #8f959e; display: flex; align-items: center; gap: 5px; }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 6px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.kpi .value .unit { font-size: 13px; font-weight: 400; color: #8f959e; margin-left: 3px; }
.kpi .delta { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.kpi .delta .cmp { color: #a5abb5; }
.kpi .spark { position: absolute; right: 12px; bottom: 10px; width: 74px; height: 30px; opacity: .85; }
.help {
  width: 13px; height: 13px; border-radius: 50%; border: 1px solid #c9cfd8; color: #a5abb5;
  font-size: 9px; display: inline-flex; align-items: center; justify-content: center; cursor: help;
}

/* ============ 表格 ============ */
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; font-weight: 500; color: #8f959e; background: #fafbfc;
  padding: 9px 12px; border-bottom: 1px solid #eef0f4; white-space: nowrap;
  position: sticky; top: 0; z-index: 1;
}
table.tbl td {
  padding: 9px 12px; border-bottom: 1px solid #f4f6f9; color: #1f2329;
  font-variant-numeric: tabular-nums;
}
table.tbl tbody tr:hover { background: #fafbff; }
table.tbl td.num, table.tbl th.num { text-align: right; }
table.tbl .name { color: #1f2329; font-weight: 500; }
table.tbl .sub { color: #a5abb5; font-size: 11px; }
.tbl-wrap { overflow-x: auto; }
.bar-cell { display: flex; align-items: center; gap: 8px; }
.mini-bar { height: 6px; border-radius: 3px; background: #2f6bff; min-width: 2px; }

/* 留存热力图 */
.heat td { text-align: center; color: #fff; font-size: 12px; }
.heat td.h { font-weight: 600; }

/* ============ 图表 ============ */
.chart { width: 100%; display: block; }
.chart-wrap { position: relative; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #646a73; margin-top: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }

.tip {
  position: absolute; pointer-events: none; background: rgba(31,35,41,.92); color: #fff;
  padding: 6px 9px; border-radius: 5px; font-size: 11.5px; line-height: 1.7; white-space: nowrap;
  transform: translate(-50%, -110%); z-index: 5; opacity: 0; transition: opacity .1s;
}
.tip.show { opacity: 1; }
.tip b { font-weight: 600; }

/* ============ 漏斗 ============ */
.funnel-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
.step-list { display: flex; flex-direction: column; gap: 6px; }
.step-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid #e8ebf0; border-radius: 6px; background: #fff; font-size: 12.5px;
}
.step-item .idx {
  width: 18px; height: 18px; border-radius: 50%; background: #eef3ff; color: #2f6bff;
  font-size: 11px; display: flex; align-items: center; justify-content: center; flex: 0 0 18px;
}
.step-item .nm { flex: 1; }
.step-item .op { color: #c9cfd8; cursor: pointer; }
.step-item.add { border-style: dashed; color: #8f959e; justify-content: center; cursor: pointer; }
.step-item.add:hover { border-color: #2f6bff; color: #2f6bff; }

.funnel-rows { display: flex; flex-direction: column; gap: 4px; }
.frow { display: grid; grid-template-columns: 150px 1fr 130px; align-items: center; gap: 12px; }
.frow .fname { font-size: 12.5px; color: #4e5969; text-align: right; }
.fbar { height: 34px; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12.5px; font-weight: 500; }
.fmeta { font-size: 12px; color: #646a73; }
.fgap { height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #f54a45; }

/* ============ 事件树 ============ */
.tree { font-size: 12.5px; }
.tree-group { padding: 6px 8px; color: #8f959e; font-size: 11.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.tree-group:hover { background: #f5f7fa; border-radius: 5px; }
.tree-group .cnt { margin-left: auto; color: #c9cfd8; font-size: 11px; }
.tree-item {
  padding: 6px 8px 6px 22px; border-radius: 5px; cursor: pointer; display: flex;
  align-items: center; gap: 6px; color: #1f2329;
}
.tree-item:hover { background: #f5f7fa; }
.tree-item.sel { background: #eef3ff; color: #2f6bff; }
.tree-item .cnt { margin-left: auto; color: #a5abb5; font-size: 11px; }
.panel {
  background: #fff; border: 1px solid #e8ebf0; border-radius: 8px;
}
.panel-head { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; font-size: 13px; font-weight: 600; display: flex; align-items: center; }
.panel-body { padding: 8px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  background: #eef3ff; color: #2f6bff; border: 1px solid #d6e2ff; border-radius: 14px;
  padding: 3px 8px 3px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;
}
.chip .x { cursor: pointer; opacity: .6; }
.chip .x:hover { opacity: 1; }

.filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row .lb { color: #8f959e; font-size: 12px; }

/* ============ 素材卡 ============ */
.creative-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.creative {
  border: 1px solid #e8ebf0; border-radius: 8px; overflow: hidden; background: #fff;
}
.creative .thumb {
  height: 96px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; text-align: center; padding: 8px; line-height: 1.5;
}
.creative .info { padding: 8px 10px; font-size: 11.5px; color: #646a73; }
.creative .info .t { font-size: 12.5px; color: #1f2329; font-weight: 500; margin-bottom: 4px; }
.creative .kv { display: flex; justify-content: space-between; margin-top: 3px; }
.creative .kv b { font-weight: 600; color: #1f2329; }

/* ============ 实时流 ============ */
.stream { max-height: 320px; overflow-y: auto; }
.stream-item {
  display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #f0f2f5; font-size: 12px;
}
.stream-item .t { color: #a5abb5; font-variant-numeric: tabular-nums; }
.stream-item .e { color: #2f6bff; font-weight: 500; }
.stream-item .u { color: #8f959e; margin-left: auto; font-variant-numeric: tabular-nums; }
.pulse { animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ============ 横向条形 ============ */
.hbar-list { display: flex; flex-direction: column; gap: 9px; }
.hbar-row { display: grid; grid-template-columns: 104px 1fr 136px; align-items: center; gap: 10px; font-size: 12.5px; }
.hbar-name { color: #4e5969; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { background: #f2f4f8; border-radius: 3px; height: 14px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 3px; }
.hbar-val { font-variant-numeric: tabular-nums; color: #1f2329; text-align: right; white-space: nowrap; }
.hbar-ex { color: #a5abb5; margin-left: 6px; font-size: 11px; }

/* ============ 抽屉/弹窗 ============ */
.mask {
  position: fixed; inset: 0; background: rgba(31,35,41,.45); z-index: 50;
  display: none;
}
.mask.show { display: block; }
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: 620px; background: #fff; z-index: 51;
  box-shadow: -6px 0 24px rgba(0,0,0,.08); transform: translateX(100%);
  transition: transform .22s ease; display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  height: 52px; padding: 0 18px; display: flex; align-items: center; border-bottom: 1px solid #f0f2f5;
}
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.close { margin-left: auto; cursor: pointer; color: #8f959e; font-size: 18px; line-height: 1; }

.desc-list { display: grid; grid-template-columns: 96px 1fr; gap: 10px 12px; font-size: 12.5px; }
.desc-list .k { color: #8f959e; }
.code {
  font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px;
  background: #f7f8fa; border: 1px solid #eef0f4; border-radius: 4px; padding: 1px 5px; color: #4e5969;
}
pre.codeblock {
  background: #fafbfc; border: 1px solid #eef0f4; border-radius: 6px; padding: 12px;
  font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.7;
  color: #4e5969; overflow-x: auto; margin: 0;
}

/* 空/提示 */
.note {
  background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 8px 12px;
  font-size: 12px; color: #8a6d1a; display: flex; gap: 8px; align-items: flex-start;
}
.prototype-banner {
  position: fixed; bottom: 14px; right: 20px; z-index: 40;
  background: rgba(31,35,41,.86); color: #fff; font-size: 11.5px; padding: 6px 12px; border-radius: 14px;
}
.hide { display: none !important; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.muted { color: #8f959e; }
.right { text-align: right; }

/* ============ 小指标块 ============ */
.mini-kpi {
  border: 1px solid #e8ebf0; border-radius: 6px; padding: 10px 12px; background: #fafbfc;
}
.mini-kpi .l { font-size: 12px; color: #8f959e; }
.mini-kpi .v { font-size: 19px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.mini-kpi .v .unit { font-size: 12px; font-weight: 400; color: #8f959e; margin-left: 3px; }
.mini-kpi .s { font-size: 11.5px; color: #a5abb5; margin-top: 3px; }

/* ============ 堆叠占比条 ============ */
.stack-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: #f2f4f8; }
.stack-bar span {
  display: flex; align-items: center; justify-content: center; height: 100%;
  font-size: 11px; color: #fff; overflow: hidden; white-space: nowrap;
}
.stack-bar span i { font-style: normal; opacity: .95; }

/* ============ 事件关联链路 ============ */
.rel-chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.rel-node {
  background: #f4f6fa; border: 1px solid #e8ebf0; border-radius: 5px;
  padding: 4px 9px; font-size: 11.5px; color: #4e5969; font-family: Menlo, monospace;
  cursor: pointer;
}
.rel-node:hover { border-color: #2f6bff; color: #2f6bff; }
.rel-node.cur { background: #2f6bff; border-color: #2f6bff; color: #fff; font-weight: 600; }
.rel-arrow { color: #c9cfd8; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
.rel-arrow i { font-style: normal; font-size: 10.5px; color: #f54a45; }
.rel-attrs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ============ 埋点：链路图谱 ============ */
.chain-block { padding: 12px 0; border-bottom: 1px dashed #eef0f4; }
.chain-block:last-child { border-bottom: none; }
.chain-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.chain-title .muted { font-weight: 400; margin-left: 8px; font-size: 12px; }
.chain-nodes { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.chain-node {
  background: #eef3ff; border: 1px solid #d6e2ff; color: #2f6bff; border-radius: 5px;
  padding: 5px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chain-node:hover { background: #2f6bff; color: #fff; }
.chain-node i { font-style: normal; font-size: 10.5px; opacity: .75; font-variant-numeric: tabular-nums; }

/* ============ 用户属性卡 ============ */
.prop-card { border: 1px solid #e8ebf0; border-radius: 6px; padding: 10px 12px; }
.pc-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.pc-title .muted { font-weight: 400; font-size: 11.5px; margin-left: 6px; }
.pc-item { font-size: 12px; color: #4e5969; padding: 4px 0; border-top: 1px dashed #f0f2f5; }
.pc-item .code { margin-right: 6px; }

/* ============ 分群 ============ */
.seg-list { display: flex; flex-direction: column; gap: 4px; }
.seg-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.seg-item:hover { background: #f5f7fa; }
.seg-item.sel { background: #eef3ff; border-color: #d6e2ff; }
.seg-top { display: flex; align-items: center; gap: 8px; }
.seg-name { font-size: 12.5px; font-weight: 500; }
.seg-cnt { margin-left: auto; font-size: 12px; color: #4e5969; font-variant-numeric: tabular-nums; }
.seg-meta { margin-top: 5px; display: flex; gap: 6px; align-items: center; font-size: 11px; flex-wrap: wrap; }
.seg-detail { background: #fff; border: 1px solid #e8ebf0; border-radius: 8px; padding: 16px; }
.sd-head { display: flex; align-items: flex-start; gap: 12px; }
.sd-name { font-size: 15px; font-weight: 600; }
.sd-desc { font-size: 12px; color: #646a73; margin-top: 4px; }
.dist-block { border: 1px solid #e8ebf0; border-radius: 6px; padding: 10px 12px; }
.dist-title { font-size: 12px; color: #8f959e; margin-bottom: 8px; }
.dist-row { display: grid; grid-template-columns: 88px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 11.5px; }
.dist-row .dn { color: #4e5969; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dist-row .dt { background: #f2f4f8; height: 10px; border-radius: 3px; overflow: hidden; }
.dist-row .df { height: 100%; border-radius: 3px; }
.dist-row .dv { text-align: right; color: #646a73; font-variant-numeric: tabular-nums; }

/* ============ 可点击行 / 可点击卡片 ============ */
tr.row-btn { cursor: pointer; }
tr.row-btn:hover { background: #f5f8ff !important; }
.kpi-btn { cursor: pointer; transition: box-shadow .15s, transform .15s; }
.kpi-btn:hover { box-shadow: 0 2px 10px rgba(47, 107, 255, .14); transform: translateY(-1px); }
tr.hl-row { background: #fffdf5; }
tr.hl-row:hover { background: #fff9e6 !important; }

/* ============ 表格排序 ============ */
table.tbl th.sortable { cursor: pointer; user-select: none; }
table.tbl th.sortable:hover { color: #2f6bff; }
.srt { margin-left: 4px; font-size: 10px; color: #c9cfd8; }
table.tbl th[data-dir="asc"] .srt,

<script>
/* ===============================
   轻量级 SVG 图表（零依赖）
   =============================== */
const Charts = (() => {
  const C = ['#2f6bff', '#17b26a', '#f5a623', '#7a4ddd', '#f54a45', '#00b8d9', '#eb2f96', '#8f959e'];

  const fmt = n => {
    if (typeof n !== 'number') return n;
    if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(1) + '万';
    return n.toLocaleString('zh-CN');
  };

  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const r = v / p;
    const m = r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10;
    return m * p;
  }

  /* 图表数据存储，供 hover tooltip 使用 */
  const store = [];
  const put = o => (store.push(o), store.length - 1);

  /* ---------- 多系列折线 / 面积图 ---------- */
  function line(opts) {
    const {
      labels = [], series = [], height = 260, width = 900, area = false,
      yFormat = fmt, smooth = true, dualAxis = false
    } = opts;
    const padL = 52, padR = dualAxis ? 52 : 16, padT = 14, padB = 26;
    const iw = width - padL - padR, ih = height - padT - padB;
    const all = series.flatMap(s => s.data);
    const max = niceMax(Math.max(...all) * 1.12);
    const ticks = 4;
    const X = i => padL + (labels.length <= 1 ? iw / 2 : (i * iw) / (labels.length - 1));
    const Y = v => padT + ih - (v / max) * ih;

    let g = '';
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i, y = Y(v);
      g += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#a5abb5">${yFormat(Math.round(v))}</text>`;
    }
    const step = Math.ceil(labels.length / 8);
    labels.forEach((lb, i) => {
      if (i % step === 0 || i === labels.length - 1) {
        g += `<text x="${X(i).toFixed(1)}" y="${height - 7}" text-anchor="middle" font-size="11" fill="#a5abb5">${lb}</text>`;
      }
    });

    series.forEach((s, si) => {
      const color = s.color || C[si % C.length];
      const pts = s.data.map((v, i) => [X(i), Y(v)]);
      let d;
      if (smooth) {
        d = pts.map((p, i) => {
          if (i === 0) return `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
          const prev = pts[i - 1];
          const cx = (prev[0] + p[0]) / 2;
          return `C${cx.toFixed(1)},${prev[1].toFixed(1)} ${cx.toFixed(1)},${p[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
        }).join(' ');
      } else {
        d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      }
      if (area) {
        const a = d + ` L${X(s.data.length - 1).toFixed(1)},${(padT + ih).toFixed(1)} L${padL},${(padT + ih).toFixed(1)} Z`;
        g += `<path d="${a}" fill="${color}" opacity="0.10"/>`;
      }
      g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
      pts.forEach(p => {
        g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#fff" stroke="${color}" stroke-width="1.6"/>`;
      });
    });

    // hover 竖线
    g += `<line class="hover-line" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" stroke="#c9cfd8" stroke-dasharray="3 3" style="display:none"/>`;
    g += `<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hover-rect"/>`;

    const cid = put({ labels, series, yFormat, padL, padR, width, height });
    return `<svg class="chart" viewBox="0 0 ${width} ${height}" data-chart="line" data-cid="${cid}">${g}</svg>`;
  }

  /* ---------- 柱状图（分组） ---------- */
  function bar(opts) {
    const { labels = [], series = [], height = 250, width = 900, yFormat = fmt } = opts;
    const padL = 52, padR = 16, padT = 14, padB = 26;
    const iw = width - padL - padR, ih = height - padT - padB;
    const max = niceMax(Math.max(...series.flatMap(s => s.data)) * 1.12);
    const ticks = 4;
    let g = '';
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i, y = padT + ih - (v / max) * ih;
      g += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="#eef0f4"/>`;
      g += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#a5abb5">${yFormat(Math.round(v))}</text>`;
    }
    const gw = iw / labels.length;
    const n = series.length;
    const bw = Math.min(22, (gw * 0.62) / n);
    labels.forEach((lb, i) => {
      series.forEach((s, si) => {
        const h = (s.data[i] / max) * ih;
        const x = padL + gw * i + gw / 2 - (bw * n) / 2 + si * bw;
        const y = padT + ih - h;
        g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="2.5" fill="${s.color || C[si % C.length]}" opacity="0.92"><title>${s.name} ${lb}: ${fmt(s.data[i])}</title></rect>`;
      });
      g += `<text x="${(padL + gw * i + gw / 2).toFixed(1)}" y="${height - 7}" text-anchor="middle" font-size="11" fill="#a5abb5">${lb}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${width} ${height}">${g}</svg>`;
  }

  /* ---------- 横向条形（排行） ---------- */
  function hbar(items, opts = {}) {
    const { color = '#2f6bff', unit = '', max: fixedMax } = opts;
    const max = fixedMax || Math.max(...items.map(i => i.value));
    return `<div class="hbar-list">` + items.map(it => `
      <div class="hbar-row">
        <div class="hbar-name">${it.name}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${(it.value / max * 100).toFixed(1)}%;background:${it.color || color}"></div></div>
        <div class="hbar-val">${fmt(it.value)}${unit}${it.extra ? `<span class="hbar-ex">${it.extra}</span>` : ''}</div>
      </div>`).join('') + `</div>`;
  }

  /* ---------- 迷你 sparkline ---------- */
  function spark(data, color = '#2f6bff', w = 74, h = 30) {
    const max = Math.max(...data), min = Math.min(...data);
    const range = max - min || 1;
    const pts = data.map((v, i) => [
      (i / (data.length - 1)) * (w - 2) + 1,
      h - 2 - ((v - min) / range) * (h - 6)
    ]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2" fill="${color}"/>
    </svg>`;
  }

  /* ---------- 漏斗（梯形，SVG） ---------- */
  function funnel(steps, opts = {}) {
    const { width = 520, rowH = 56, gap = 30, padL = 128, padR = 108, sel = null } = opts;
    const total = width + padL + padR;
    const maxV = steps[0].value;
    const minW = width * 0.18;
    const W = v => Math.max(minW, (v / maxV) * width);
    const height = steps.length * rowH + (steps.length - 1) * gap + 6;
    const cx = padL + width / 2;
    let g = '';
    steps.forEach((s, i) => {
      const topW = W(s.value);
      const nextV = i < steps.length - 1 ? steps[i + 1].value : s.value * 0.7;
      const botW = W(nextV);
      const y = i * (rowH + gap) + 3;
      const alpha = 0.92 - i * (0.52 / Math.max(1, steps.length - 1));
      const color = s.color || `rgba(47,107,255,${alpha.toFixed(3)})`;
      const dark = !s.color && alpha < 0.56;
      const pts = `${(cx - topW / 2).toFixed(1)},${y} ${(cx + topW / 2).toFixed(1)},${y} ${(cx + botW / 2).toFixed(1)},${(y + rowH)} ${(cx - botW / 2).toFixed(1)},${(y + rowH)}`;
      const dimCls = sel !== null && sel !== i ? ' fn-poly dim' : ' fn-poly';
      g += `<polygon class="${dimCls.trim()}" data-step="${i}" points="${pts}" fill="${color}"><title>${s.name}：${fmt(s.value)}</title></polygon>`;
      g += `<text x="${cx}" y="${y + rowH / 2}" text-anchor="middle" font-size="13" fill="${dark ? '#1f2329' : '#fff'}" font-weight="500">${s.name}</text>`;
      g += `<text x="${cx}" y="${y + rowH / 2 + 16}" text-anchor="middle" font-size="11.5" fill="${dark ? 'rgba(31,35,41,.68)' : 'rgba(255,255,255,.92)'}">${fmt(s.value)}</text>`;
      // 左侧步骤名
      g += `<text x="2" y="${y + rowH / 2 - 2}" font-size="12" fill="#1f2329">${i + 1}. ${s.name}</text>`;
      g += `<text x="2" y="${y + rowH / 2 + 14}" font-size="11" fill="#a5abb5">${fmt(s.value)}</text>`;
      // 层间转化率
      if (i > 0) {
        const prev = steps[i - 1].value;
        const rate = s.value / prev;
        const midY = y - gap / 2 + 2;
        g += `<text x="${total - 2}" y="${midY}" text-anchor="end" font-size="12.5" fill="#f54a45" font-weight="600">转化 ${(rate * 100).toFixed(1)}%</text>`;
        g += `<text x="${total - 2}" y="${midY + 15}" text-anchor="end" font-size="11" fill="#a5abb5">流失 ${fmt(prev - s.value)}</text>`;
        g += `<line x1="${cx}" y1="${y - gap + 6}" x2="${cx}" y2="${y - 2}" stroke="#c9cfd8" stroke-dasharray="3 3"/>`;
      }
    });
    return `<svg class="chart" viewBox="0 0 ${total} ${height}" style="max-width:${total}px;margin:0 auto">${g}</svg>`;
  }

  /* ---------- 环形/进度 ---------- */
  function donut(pct, color = '#2f6bff', size = 96) {
    const r = size / 2 - 8, c = 2 * Math.PI * r;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#eef0f4" stroke-width="9"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"
        transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="50%" y="50%" text-anchor="middle" dy="6" font-size="16" font-weight="600" fill="#1f2329">${(pct * 100).toFixed(1)}%</text>
    </svg>`;
  }

  /* ---------- 散点 / 气泡（留存 vs LTV 四象限） ---------- */
  function scatter(points, opts = {}) {
    const {
      width = 560, height = 320, xLabel = '', yLabel = '',
      xSuffix = '%', yPrefix = '¥', padL = 56, padR = 24, padT = 18, padB = 40,
      xMin = 0, quadX = null, quadY = null
    } = opts;
    const iw = width - padL - padR, ih = height - padT - padB;
    const xs = points.map(p => p.x), ys = points.map(p => p.y), rs = points.map(p => p.r || 1);
    const xMax = opts.xMax || niceMax(Math.max(...xs) * 1.1);
    const yMax = opts.yMax || niceMax(Math.max(...ys) * 1.12);
    const rMax = Math.max(...rs);
    const X = v => padL + ((v - xMin) / (xMax - xMin)) * iw;
    const Y = v => padT + ih - (v / yMax) * ih;
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (ih / 4) * i;
      g += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="#eef0f4"/>`;
      g += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#a5abb5">${yPrefix}${(yMax - (yMax / 4) * i).toFixed(1)}</text>`;
    }
    for (let i = 0; i <= 4; i++) {
      const v = xMin + ((xMax - xMin) / 4) * i, x = X(v);
      g += `<text x="${x.toFixed(1)}" y="${height - padB + 18}" text-anchor="middle" font-size="11" fill="#a5abb5">${v.toFixed(1)}${xSuffix}</text>`;
    }
    if (quadX !== null && quadY !== null) {
      g += `<line x1="${X(quadX).toFixed(1)}" y1="${padT}" x2="${X(quadX).toFixed(1)}" y2="${padT + ih}" stroke="#c9cfd8" stroke-dasharray="4 4"/>`;
      g += `<line x1="${padL}" y1="${Y(quadY).toFixed(1)}" x2="${width - padR}" y2="${Y(quadY).toFixed(1)}" stroke="#c9cfd8" stroke-dasharray="4 4"/>`;
      g += `<text x="${(width - padR - 6)}" y="${(Y(quadY) - 6).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#17b26a">高留存 · 高 LTV（加大投放）</text>`;
      g += `<text x="${(padL + 6)}" y="${(padT + 14).toFixed(1)}" font-size="10.5" fill="#f54a45">高留存 · 低变现</text>`;
    }
    points.forEach((p, i) => {
      const cx = X(p.x), cy = Y(p.y), r = 5 + (p.r / rMax) * 11;
      const color = p.color || C[i % C.length];
      g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}" opacity="0.28" stroke="${color}" stroke-width="1.4"><title>${p.name}：${xLabel} ${p.x}${xSuffix} · ${yLabel} ${yPrefix}${p.y}</title></circle>`;
      g += `<text x="${(cx + r + 4).toFixed(1)}" y="${(cy + 4).toFixed(1)}" font-size="11" fill="#4e5969">${p.name}</text>`;
    });
    g += `<text x="${(width - padR)}" y="${height - 4}" text-anchor="end" font-size="11" fill="#a5abb5">${xLabel}</text>`;
    g += `<text x="${padL - 44}" y="${padT - 4}" font-size="11" fill="#a5abb5">${yLabel}</text>`;
    return `<svg class="chart" viewBox="0 0 ${width} ${height}">${g}</svg>`;
  }

  /* ---------- 堆叠占比条（构成对比） ---------- */
  function stackBar(parts, opts = {}) {
    const { width = 100 } = opts;
    return `<div class="stack-bar">` + parts.map(p =>
      `<span style="width:${p.v}%;background:${p.color}"><i>${p.name} ${p.v}%</i></span>`).join('') + `</div>`;
  }

  return { line, bar, hbar, spark, funnel, donut, scatter, stackBar, fmt, C, store };
})();

</script>

const seedRand = seed => { let s = seed; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; };

function gen(seed, base, trend, amp, noise, n = 30) {
  const r = seedRand(seed), out = [];
  for (let i = 0; i < n; i++) {
    const wk = (i % 7 === 5 || i % 7 === 6) ? 1.13 : 1;
    const v = base * (1 + trend * i / 100) * (1 + Math.sin(i / 3.6) * amp) * (1 + (r() - 0.5) * noise) * wk;
    out.push(Math.round(v));
  }
  return out;
}

  };

function funnelRows(steps) {
  const max = steps[0].value;

    h += `<div class="frow">
      <div class="fname">${i + 1}. ${s.name}</div>
      <div><div class="fbar" style="width:${w}%;background:rgba(47,107,255,${(1 - i * 0.12).toFixed(2)})">
        ${fmt(s.value)} 人
      </div></div>
      <div class="fmeta">${i === 0 ? '100%' :
        `<span class="up">${pct(s.value, steps[i - 1].value)}</span> · 流失 ${fmt(steps[i - 1].value - s.value)}`}</div>
    </div>`;
    if (i < steps.length - 1) h += `<div class="frow"><div></div><div class="fgap">▼</div><div></div></div>`;
  });
  return h + '</div>';
}

  const { width = 880, h = 330, nodeW = 118, gapY = 10 } = opts;

  const colGap = (width - ncol * nodeW) / (ncol - 1);
  const scale = cols.map(c => (h - (c.length - 1) * gapY) / c.reduce((s, n) => s + n.value, 0));
  const pos = {};
  cols.forEach((c, ci) => {
    let y = 0;
    c.forEach(n => {
      const nh = n.value * scale[ci];
      pos[n.name] = { x: ci * (nodeW + colGap), y, h: nh, ci };
      y += nh + gapY;
    });
  });
  const outOff = {}, inOff = {}, palette = ['#2f6bff', '#17b26a', '#f5a623', '#7a4ddd', '#00b8d9', '#f54a45', '#eb2f96'];

    const a = pos[l.from], b = pos[l.to];
    if (!a || !b) return;
    const ao = outOff[l.from] || 0, bo = inOff[l.to] || 0;
    const ah = l.value * scale[a.ci], bh = l.value * scale[b.ci];
    const x1 = a.x + nodeW, x2 = b.x, mx = (x1 + x2) / 2;
    const y1 = a.y + ao, y2 = b.y + bo;
    g += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2} L${x2},${y2 + bh} C${mx},${y2 + bh} ${mx},${y1 + ah} ${x1},${y1 + ah} Z" fill="${palette[i % palette.length]}" opacity="0.16"><title>${l.from} → ${l.to}：${fmt(l.value)}</title></path>`;
    outOff[l.from] = ao + ah; inOff[l.to] = bo + bh;
  });
  cols.forEach((c, ci) => c.forEach(n => {
    const p = pos[n.name], col = palette[ci % palette.length];
    g += `<rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${Math.max(p.h, 4)}" rx="3" fill="${col}"/>`;
    g += `<text x="${p.x + 7}" y="${p.y + Math.min(p.h / 2 + 4, 16)}" font-size="11.5" fill="#fff" font-weight="500">${n.name}</text>`;
    if (p.h > 26) g += `<text x="${p.x + 7}" y="${p.y + Math.min(p.h / 2 + 19, 32)}" font-size="10.5" fill="rgba(255,255,255,.9)">${fmt(n.value)}</text>`;
  }));
  return `<svg class="chart" viewBox="0 0 ${width} ${h + 6}">${g}</svg>`;
}

<script>
/* ===========================================================
   detail.js —— 事件分析 / 漏斗分析 / 广告变现（1:1 高保真重做）
   覆盖 views.js 中的同名视图，加载顺序需在 views.js 之后
   =========================================================== */

const qnum = n => Math.round(n).toLocaleString('zh-CN');
const qpct = (a, b) => (b ? a / b * 100 : 0);

function qhash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}
function qrand(seed) {
  let s = seed;
  return () => { s = Math.sin(s * 127.1) * 43758.5453; return s - Math.floor(s); };
}
/* 按总量切分到 n 个点，和恒等于 total */
function qdist(total, n, seed) {
  const r = qrand(seed);
  const raw = Array.from({ length: n }, (_, i) => 1 + Math.sin(i * 0.7 + seed * 6) * 0.12 + (r() - 0.5) * 0.22);
  const sum = raw.reduce((a, b) => a + b, 0);
  const out = raw.map(v => Math.max(1, Math.round(total * v / sum)));
  const diff = total - out.reduce((a, b) => a + b, 0);
  out[out.length - 1] += diff;
  return out;
}
function evItem(k) {
  return D.eventTree.flatMap(g => g.items).find(i => i.k === k) || { k, n: k, c: 0 };
}
function evGroupOf(k) {
  const g = D.eventTree.find(x => x.items.some(i => i.k === k));
  return g ? g.group : '未分组';
}

/* ===========================================================
   1. 事件分析
   =========================================================== */
const EV = window.EV = {
  k: 'AdShow', n: '广告展示',
  metric: 'count', dim: 'channel', grain: 'day', chart: 'line',
  compare: false, cmpK: null, cmpN: null,
  hide: {}, filters: [{ p: 'ad_position', op: '=', v: 'rewarded' }],
  fav: ['AdShow', 'UnlockSuccess', 'LoginSuccess', 'AdError'],
  tab: 'all', recent: ['AdShow', 'UnlockSuccess', 'EpisodeStart', 'AdRewarded']
};

const EV_METRICS = [
  ['count', '触发次数'], ['users', '触发用户数'], ['per', '人均次数'],
  ['device', '去重设备数'], ['sum', '数值求和（播放时长）']
];
const EV_DIMS = [
  ['channel', '归因渠道'], ['slot', '广告位'], ['source', '广告源'], ['scene', '触发场景'],
  ['drama', '剧集'], ['model', '机型'], ['city', '城市线级'], ['none', '不拆分']
];
const EV_GRAINS = [['hour', '按小时'], ['day', '按天'], ['week', '按周']];

function evCountTotal() {
  return Math.round((evItem(EV.k).c || 100000) * Math.pow(0.82, EV.filters.length));
}
function evLabels() {
  if (EV.grain === 'hour') return D.hourly.labels;
  if (EV.grain === 'week') return Array.from({ length: 12 }, (_, i) => 'W' + (i + 1));
  return sl(DATES).map(d => d.slice(5));
}
function evSeriesOf(k, total, salt) {
  const n = evLabels().length;
  if (EV.grain === 'hour') {
    const shape = D.hourly.imp;
    const sum = shape.reduce((a, b) => a + b, 0);
    return shape.map(v => Math.round(total * v / sum));
  }
  return qdist(total, n, qhash(k + EV.grain + salt));
}
function evBuild() {
  const cntTotal = evCountTotal();
  const uTot = Math.round(cntTotal * 0.62);
  const cnt = evSeriesOf(EV.k, cntTotal, EV.dim);
  const usr = evSeriesOf(EV.k, uTot, 'u' + EV.dim);
  let data, unit, head;
  switch (EV.metric) {
    case 'users': data = usr; unit = '人'; head = uTot; break;
    case 'device': data = usr.map(v => Math.round(v * 0.93)); unit = '台'; head = Math.round(uTot * 0.93); break;
    case 'per': data = cnt.map((v, i) => +(v / Math.max(1, usr[i])).toFixed(2)); unit = '次'; head = +(cntTotal / Math.max(1, uTot)).toFixed(2); break;
    case 'sum': data = cnt.map(v => Math.round(v * 24.6)); unit = '秒'; head = Math.round(cntTotal * 24.6); break;
    default: data = cnt; unit = '次'; head = cntTotal;
  }
  const prev = data.map((v, i) => +(v * (0.84 + (i % 5) * 0.012)).toFixed(EV.metric === 'per' ? 2 : 0));
  let cmp = null;
  if (EV.compare && EV.cmpK) {
    const cTotal = Math.round((evItem(EV.cmpK).c || 100000) * Math.pow(0.82, EV.filters.length));
    const cArr = evSeriesOf(EV.cmpK, EV.metric === 'users' ? Math.round(cTotal * 0.62) : cTotal, EV.dim);
    cmp = EV.metric === 'sum' ? cArr.map(v => Math.round(v * 24.6)) : cArr;
  }
  return { data, prev, cmp, unit, head, cntTotal, uTot };
}

/* 迷你多环 donut（收入/构成占比） */
function qDonut(parts, opts = {}) {
  const { size = 168, thick = 22, inner = '' } = opts;
  const r = size / 2 - thick / 2 - 2, c = 2 * Math.PI * r;
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  let off = 0, g = '';
  parts.forEach(p => {
    const len = c * p.v / total;
    g += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${thick}"
      stroke-dasharray="${Math.max(len - 2.5, 0.5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"
      style="cursor:pointer" data-donut="${p.name}"><title>${p.name}：${qnum(p.v)}（${(p.v / total * 100).toFixed(1)}%）</title></circle>`;
    off += len;
  });
  g += `<text x="50%" y="47%" text-anchor="middle" font-size="11" fill="#8f959e">${parts.length} 项合计</text>`;
  g += `<text x="50%" y="60%" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2329">${inner || Charts.fmt(total)}</text>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${g}</svg>`;
}

/* 瀑布图（ARPU / 收入拆解） */
function qWaterfall(items, opts = {}) {
  const { width = 620, height = 220, suffix = '' } = opts;
  const padL = 40, padT = 22, padB = 34, padR = 12;
  const iw = width - padL - padR, ih = height - padT - padB;
  const cum = [];
  let acc = 0;
  items.forEach((it, i) => {
    if (i === 0 || it.type === 'total') { acc = it.v; cum.push([0, it.v]); }
    else { cum.push([acc, acc + it.v]); acc += it.v; }
  });
  const maxV = Math.max(...cum.map(c => Math.max(c[0], c[1]))) * 1.08;
  const Y = v => padT + ih - (v / maxV) * ih;
  const bw = Math.min(46, iw / items.length * 0.58);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = maxV / 3 * i, y = Y(v);
    g += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="#eef0f4"/>`;
    g += `<text x="${padL - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#a5abb5">${Charts.fmt(Math.round(v))}</text>`;
  }
  items.forEach((it, i) => {
    const [a, b] = cum[i];
    const x = padL + iw / items.length * (i + 0.5) - bw / 2;
    const y1 = Y(Math.max(a, b)), hgt = Math.max(2, Math.abs(Y(a) - Y(b)));
    const isTotal = i === 0 || it.type === 'total';
    const color = isTotal ? '#2f6bff' : it.v >= 0 ? '#17b26a' : '#f54a45';
    g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw}" height="${hgt.toFixed(1)}" rx="3" fill="${color}" opacity="${isTotal ? .95 : .78}"><title>${it.name}：${it.v > 0 && i ? '+' : ''}${Charts.fmt(it.v)}${suffix}</title></rect>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y1 - 5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${color}">${isTotal ? Charts.fmt(it.v) : (it.v >= 0 ? '+' : '') + Charts.fmt(it.v)}</text>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${height - 14}" text-anchor="middle" font-size="10.5" fill="#646a73">${it.name}</text>`;
    if (!isTotal && i < items.length - 1) {
      const yc = Y(b);
      g += `<line x1="${(x + bw).toFixed(1)}" y1="${yc.toFixed(1)}" x2="${(padL + iw / items.length * (i + 1.5) - bw / 2).toFixed(1)}" y2="${yc.toFixed(1)}" stroke="#c9cfd8" stroke-dasharray="3 3"/>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${width} ${height}">${g}</svg>`;
}

/* 行数组直接导出 CSV */
function dtlCsv(name, rows) {
  const txt = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  try {
    const blob = new Blob(['\ufeff' + txt], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name}_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { /* 忽略 */ }
  Toast(`已导出「${name}」· ${rows.length - 1} 行`);
}

    /* ---------- 查询构建器 ---------- */
    const metricSel = `<select class="select qb-sel" data-metric>${EV_METRICS.map(([k, n]) => `<option value="${k}" ${EV.metric === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    const dimSel = `<select class="select qb-sel" data-dim>${EV_DIMS.map(([k, n]) => `<option value="${k}" ${EV.dim === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    const grainSel = `<select class="select qb-sel" data-grain>${EV_GRAINS.map(([k, n]) => `<option value="${k}" ${EV.grain === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;

    const filterChips = EV.filters.length
      ? EV.filters.map((f, i) => `<span class="chip f">${f.p} <b>${f.op}</b> ${f.v}<span class="x" data-fdel="${i}">×</span></span>`).join('')
      : `<span class="muted" style="font-size:12px">未设置过滤条件，将统计全部用户</span>`;

    const qb = `
      <div class="qb">
        <div class="qb-row">
          <div class="qb-lb">分析事件</div>
          <div class="qb-bd">
            <span class="chip ev">${it.n}<em class="code">${K}</em><span class="x" data-cmpdel="main" title="清除">×</span></span>
            ${EV.compare && EV.cmpK ? `<span class="qb-and">VS</span>
              <span class="chip ev c2">${EV.cmpN}<em class="code">${EV.cmpK}</em><span class="x" data-cmpdel="cmp">×</span></span>`
        : `<span class="chip add" data-cmpadd>＋ 添加对比事件</span>`}
          </div>
        </div>
        <div class="qb-row">
          <div class="qb-lb">统计口径</div>
          <div class="qb-bd">
            <span class="qb-k">指标</span>${metricSel}
            <span class="qb-k">维度拆分</span>${dimSel}
            <span class="qb-k">时间粒度</span>${grainSel}
            <span class="qb-k">过滤</span>
            <span class="badge-soft">${EV.filters.length} 条</span>
          </div>
        </div>
        <div class="qb-row">
          <div class="qb-lb">过滤条件</div>
          <div class="qb-bd">
            ${filterChips}
            <span class="chip add" data-fadd>＋ 添加过滤条件</span>
          </div>
        </div>
        <div class="qb-foot">
          <div class="qb-hint">
            <span class="dot-live"></span>数据就绪 · 命中 <b>${Charts.fmt(B.cntTotal)}</b> 次事件 / <b>${Charts.fmt(B.uTot)}</b> 位用户
            <span class="muted">· 更新时间 09:20</span>
          </div>
          <div class="qb-acts">
            <button class="btn sm" id="evSaveBtn">保存为看板</button>
            <button class="btn sm" id="evExportBtn">导出 CSV</button>
            <button class="btn primary" id="evQueryBtn">查询</button>
          </div>
        </div>
      </div>`;

    /* ---------- 指标概览 ---------- */
    const prevHead = EV.metric === 'per'
      ? +(B.prev.reduce((a, b) => a + b, 0) / B.prev.length).toFixed(2)
      : B.prev.reduce((a, b) => a + b, 0);
    const delta = prevHead ? (B.head - prevHead) / prevHead * 100 : 0;
    const mName = EV_METRICS.find(m => m[0] === EV.metric)[1];
    const miniKpi = `
      <div class="mini-kpis">
        <div class="mini-kpi"><div class="l">${mName}</div><div class="v">${Charts.fmt(B.head)}<span class="u">${B.unit}</span></div>
          <div class="d"><span class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(1)}%</span><span class="cmp">环比</span></div></div>
        <div class="mini-kpi"><div class="l">触发用户数</div><div class="v">${Charts.fmt(B.uTot)}<span class="u">人</span></div>
          <div class="d"><span class="muted">占 DAU ${(B.uTot / D.summary.dau * 100).toFixed(1)}%</span></div></div>
        <div class="mini-kpi"><div class="l">人均次数</div><div class="v">${(B.cntTotal / Math.max(1, B.uTot)).toFixed(2)}<span class="u">次</span></div>
          <div class="d"><span class="muted">P90 ${(B.cntTotal / Math.max(1, B.uTot) * 2.8).toFixed(1)} 次</span></div></div>
        <div class="mini-kpi"><div class="l">事件属性</div><div class="v" style="font-size:15px">${evGroupOf(K)}</div>
          <div class="d"><span class="muted">${(D.eventParams[K] || D.eventParams.AdShow || []).length} 个参数</span></div></div>
      </div>`;

    /* ---------- 趋势图 ---------- */
    const labels = evLabels();
    const series = [];
    if (!EV.hide.cur) series.push({ name: it.n, data: B.data, color: '#2f6bff' });
    if (!EV.hide.prev) series.push({ name: '上一周期', data: B.prev, color: '#c9cfd8', dash: true });
    if (B.cmp && !EV.hide.cmp) series.push({ name: EV.cmpN, data: B.cmp, color: '#7a4ddd' });

    let chart = '';
    if (!series.length) chart = `<div class="empty">所有系列已隐藏，点击下方图例恢复</div>`;
    else if (EV.chart === 'bar') chart = Charts.bar({ labels, series, height: 268, yFormat: v => Charts.fmt(v) });
    else {
      const cum = arr => arr.reduce((acc, v) => (acc.push((acc.length ? acc[acc.length - 1] : 0) + v), acc), []);
      const s = EV.chart === 'cum' ? series.map(x => Object.assign({}, x, { data: cum(x.data), dash: false })) : series;
      chart = Charts.line({
        labels, height: 268, area: EV.chart === 'line' && s.length === 1, series: s,
        yFormat: EV.metric === 'per' ? v => v.toFixed(1) : v => Charts.fmt(v)
      });
    }
    const legend = [
      `<span class="lg ${EV.hide.cur ? 'off' : ''}" data-lg="cur"><i style="background:#2f6bff"></i>${it.n}</span>`,
      EV.compare && EV.cmpK ? `<span class="lg ${EV.hide.cmp ? 'off' : ''}" data-lg="cmp"><i style="background:#7a4ddd"></i>${EV.cmpN}</span>` : '',
      `<span class="lg ${EV.hide.prev ? 'off' : ''}" data-lg="prev"><i style="background:#c9cfd8"></i>上一周期</span>`
    ].join('');

    const chartSeg = [['line', '折线'], ['bar', '柱状'], ['cum', '累计']].map(([k, n]) =>
      `<button class="${EV.chart === k ? 'active' : ''}" data-ec="${k}">${n}</button>`).join('');

    /* ---------- 维度拆分 ---------- */
    const dd = EV.dim !== 'none' ? D.evDimSplit[EV.dim] : null;
    let dimBlock = '';
    if (dd) {
      const hasBar = dd.head[dd.head.length - 1] === '分布';
      const head = dd.head.map((h, i) => `<th class="${i === 0 ? '' : 'num'}">${h}</th>`).join('') + (hasBar ? '' : '<th>分布</th>');
      const rows = dd.rows.map(r => {
        const share = r.bar;
        const val = Math.round(B.cntTotal * share / 100);
        const cells = r.vals.map((v, i) => i === 0
          ? `<td class="num"><b>${qnum(val)}</b></td>`
          : `<td class="num">${v}</td>`).join('');
        return `<tr class="row-btn" data-evrow="${encodeURIComponent(r.name)}" data-evshare="${share}">
          <td><span class="name">${r.name}</span><div class="sub">${r.sub || ''}</div></td>
          ${cells}
          ${hasBar ? '' : `<td><div class="bar-cell"><div class="mini-bar" style="width:${Math.min(100, share * 1.5).toFixed(0)}%"></div></div></td>`}
        </tr>`;
      }).join('');
      dimBlock = `
        <div class="card">
          <div class="card-head">
            <div class="card-title">按「${dd.title}」拆分<small>${dd.hint} · 点击行下钻</small></div>
            <div class="right"><button class="btn sm" id="evDimExport">导出</button></div>
          </div>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>${head}</tr></thead><tbody>${rows}</tbody>
          </table></div>
          <div class="card-body tight"><div class="note"><span>💡</span><div>${EV.dim === 'channel'
          ? '商店渠道（小米 / 华为 / ASA）解锁率与 ARPU 均高于信息流，是 IAA 的高价值来源；信息流量大但人均广告收入低 30% 以上。'
          : EV.dim === 'model' ? '¥0-1000 机型占设备 26.4%，eCPM 仅 ¥11.8、填充率 88.6%，建议对低端机降频插屏、优先激励视频。'
            : EV.dim === 'city' ? '一线城市 eCPM 是四线的 2.5 倍，但四线贡献了 34.6% 的展示量，价格与量的平衡点在二线。'
              : '该维度下各项的触发占比与变现效率差异，可直接用于人群圈选与投放出价调整。'}</div></div></div>
        </div>`;
    } else {
      dimBlock = `<div class="card"><div class="card-body"><div class="empty">已关闭维度拆分，仅展示整体趋势。选择「维度拆分」可查看分渠道 / 机型 / 省份等分布。</div></div></div>`;
    }

    /* ---------- 数值分布 ---------- */
    const distBars = D.evDist.map((d, i) => `
      <div class="dist-row" data-dist="${d.name}">
        <span class="dn">${d.name}</span>
        <span class="dt"><i style="width:${(d.v / 42.6 * 100).toFixed(1)}%;background:${Charts.C[i % Charts.C.length]}"></i></span>
        <span class="dv">${d.v}%</span>
      </div>`).join('');
    const pctl = [['P50', 2], ['P75', 6], ['P90', 11], ['P99', 26]];
    const pctlHTML = pctl.map(([n, v]) => `<div class="pc"><span>${n}</span><b>${v} 次</b></div>`).join('');

    /* ---------- 用户属性 ---------- */
    const attrGroup = (title, list, dimKey, fmtv) => `
      <div class="attr-blk ${dimKey && EV.dim === dimKey ? 'on' : ''}" data-attrdim="${dimKey || ''}">
        <div class="attr-hd">${title}<span class="gi">${!dimKey ? '过滤条件可用' : EV.dim === dimKey ? '已拆分' : '点击拆分'}</span></div>
        <div class="dist-mini">${list.slice(0, 5).map((x, i) => `
          <div class="row"><span class="nm">${x.name}</span>
            <span class="tk"><i class="fl" style="width:${(x.share / list[0].share * 100).toFixed(0)}%;background:${Charts.C[i % Charts.C.length]}"></i></span>
            <span class="vl">${fmtv(x)}</span></div>`).join('')}</div>
      </div>`;

    /* ---------- 事件关联 ---------- */
    const relChain = rel ? `
      <div class="rel-chain">
        ${rel.up.map(e => `<span class="rel-node" data-jump="${e}">${e}</span>`).join('<span class="rel-arrow">→</span>')}
        <span class="rel-arrow">→</span><span class="rel-node cur">${K}</span><span class="rel-arrow">→</span>
        ${rel.down.map(e => `<span class="rel-node" data-jump="${e}">${e}</span>`).join('<span class="rel-arrow">·</span>')}
      </div>
      <div class="rel-attrs mt8"><span class="lb">可下钻属性</span>
        ${rel.attrs.map(a => `<span class="tag blue">${a}</span>`).join('')}</div>` : `<div class="muted">该事件未配置上下游关联</div>`;
    const relRows = rel ? rel.related.map(r => `<tr class="row-btn" data-jump="${r.ev}">
      <td><span class="name">${r.ev}</span><div class="sub">${(D.eventTree.flatMap(g => g.items).find(i => i.k === r.ev) || {}).n || ''}</div></td>
      <td class="num"><b>${r.rate}%</b></td>
      <td class="muted">${r.desc}</td>
      <td class="num"><div class="bar-cell"><div class="mini-bar" style="width:${Math.min(100, r.rate)}%"></div></div></td>
    </tr>`).join('') : '';

    return `
      <div class="ev-layout">
        <div class="panel ev-side">
          <div class="panel-head">事件库<small class="muted" style="font-weight:400">${evTotalCnt}</small>
            <div style="margin-left:auto"><button class="btn sm ghost" id="evManageBtn">管理</button></div></div>
          <div class="panel-body">
            <input class="input" id="evSearch" style="width:100%;margin-bottom:8px" placeholder="搜索事件名 / 标识（AdShow）">
            <div class="tree-tabs">${tabs}</div>
            <div class="tree" id="evTree">${treeGroups}</div>
          </div>
        </div>

        <div class="ev-main">
          <div class="card">${qb}${miniKpi}</div>

          <div class="card">
            <div class="card-head">
              <div class="card-title">${it.n} 趋势<small>${RANGE_TEXT[GS.range]} · ${EV_GRAINS.find(g => g[0] === EV.grain)[1]}</small></div>
              <div class="right">
                <div class="seg" id="evChartSeg">${chartSeg}</div>
                <label class="sw"><input type="checkbox" id="evCompareCb" ${EV.compare ? 'checked' : ''}><span>对比上一周期</span></label>
                <button class="btn sm" id="evTrendExport">导出</button>
              </div>
            </div>
            <div class="card-body rel" id="evTrendWrap">
              <div class="chart-wrap">${chart}</div>
              <div class="legend">${legend}</div>
            </div>
          </div>

          ${dimBlock}

          <div class="grid g2">
            <div class="card">
              <div class="card-head"><div class="card-title">人均触发次数分布<small>${it.n} · 用户维度</small></div>
                <div class="right"><button class="btn sm" id="evDistExport">导出</button></div></div>
              <div class="card-body">
                <div class="dist-bars">${distBars}</div>
                <div class="pctls">${pctlHTML}</div>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">用户属性交叉<small>点击任一分组切换拆分维度</small></div>
                <div class="right"><button class="btn sm primary" id="evSegBtn">沉淀为分群</button></div></div>
              <div class="card-body">
                ${attrGroup('机型档位', D.deviceTier, 'model', x => x.ecpm + '')}
                ${attrGroup('城市线级', D.cityTier, 'city', x => x.ecpm + '')}
                ${attrGroup('网络环境', D.networkType, '', x => x.ecpm + '')}
                <div class="muted" style="font-size:11.5px;margin-top:8px">数值为该分组的 eCPM（元 / 千次展示）</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">事件关联分析<small>${K} 的上下游与后续行为</small></div>
              <div class="right"><button class="btn sm" id="evChainBtn">维护关联链路</button></div></div>
            <div class="card-body">
              <div class="card-title" style="font-size:12.5px;margin-bottom:8px">关联链路${chain ? ` · ${chain.name}` : ''}</div>
              ${relChain}
              ${chain ? `<div class="muted mt8" style="font-size:12px">${chain.desc}</div>` : ''}
              ${relRows ? `<div class="tbl-wrap mt12"><table class="tbl">
                <thead><tr><th>关联事件</th><th class="num">触发占比</th><th>说明</th><th>分布</th></tr></thead>
                <tbody>${relRows}</tbody></table></div>` : ''}
            </div>
          </div>
        </div>
      </div>`;
  },

  after() {
    /* 事件选择 */
    document.querySelectorAll('[data-ev]').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.dataset.fav) return;
        const k = el.dataset.ev;
        EV.k = k; EV.n = el.dataset.evn;
        if (EV.recent.indexOf(k) < 0) { EV.recent.unshift(k); EV.recent = EV.recent.slice(0, 6); }
        if (!/^Ad|Unlock|Episode/.test(k)) EV.filters = [];
        go('event');
      });
    });
    /* 收藏 */
    document.querySelectorAll('[data-fav]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const k = el.dataset.fav;
        const i = EV.fav.indexOf(k);
        if (i >= 0) EV.fav.splice(i, 1); else EV.fav.push(k);
        go('event');
      });
    });
    /* 事件库 tab */
    document.querySelectorAll('[data-evtab]').forEach(b => {
      b.addEventListener('click', () => { EV.tab = b.dataset.evtab; go('event'); });
    });
    /* 搜索 */
    const si = $('#evSearch');
    if (si) si.addEventListener('input', () => {
      const q = (si.value || '').trim().toLowerCase();
      document.querySelectorAll('.tree-item').forEach(el => {
        const txt = (el.dataset.ev + ' ' + el.dataset.evn).toLowerCase();
        el.style.display = !q || txt.indexOf(q) >= 0 ? '' : 'none';
      });
      document.querySelectorAll('.tree-group[data-grp]').forEach(g => {
        const nm = g.dataset.grp;
        const anyShow = Array.from(document.querySelectorAll('.tree-item[data-grp="' + nm + '"]')).some(x => x.style.display !== 'none');
        g.style.display = anyShow ? '' : 'none';
      });
    });
    /* 分组折叠 */
    document.querySelectorAll('.tree-group[data-grp]').forEach(g => {
      g.addEventListener('click', () => {
        const nm = g.dataset.grp;
        const items = document.querySelectorAll('.tree-item[data-grp="' + nm + '"]');
        const hide = items.length && items[0].style.display !== 'none';
        items.forEach(el => el.style.display = hide ? 'none' : '');
      });
    });
    /* 指标 / 维度 / 粒度 */
    const mSel = document.querySelector('[data-metric]');
    if (mSel) mSel.addEventListener('change', e => { EV.metric = e.target.value; go('event'); Toast(`指标切换为「${EV_METRICS.find(m => m[0] === EV.metric)[1]}」`); });
    const dSel = document.querySelector('[data-dim]');
    if (dSel) dSel.addEventListener('change', e => { EV.dim = e.target.value; go('event'); });
    const gSel = document.querySelector('[data-grain]');
    if (gSel) gSel.addEventListener('change', e => { EV.grain = e.target.value; go('event'); });
    /* 图表形态 / 图例 */
    document.querySelectorAll('[data-ec]').forEach(b => {
      b.addEventListener('click', () => { EV.chart = b.dataset.ec; go('event'); });
    });
    document.querySelectorAll('[data-lg]').forEach(el => {
      el.addEventListener('click', () => {
        const k = el.dataset.lg;
        EV.hide[k] = !EV.hide[k];
        go('event');
      });
    });
    /* 对比开关 */
    const cb = $('#evCompareCb');
    if (cb) cb.addEventListener('change', () => {
      EV.compare = cb.checked;
      if (EV.compare && !EV.cmpK) { EV.cmpK = 'AdRequest'; EV.cmpN = '广告请求'; }
      go('event');
      Toast(EV.compare ? '已开启上一周期对比' : '已关闭对比');
    });
    /* 过滤器 */
    document.querySelectorAll('[data-fdel]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        EV.filters.splice(+el.dataset.fdel, 1);
        go('event');
        Toast('已移除过滤条件，数据已重算');
      });
    });
    const fadd = document.querySelector('[data-fadd]');
    if (fadd) fadd.addEventListener('click', () => {
      Modal.open({
        title: '添加过滤条件',
        body: `<div class="muted" style="font-size:12px;margin-bottom:10px">对「${EV.n}」的事件参数或用户属性做过滤，多个条件为「且」关系。</div>`,
        fields: [
          { label: '字段', key: 'p', type: 'select', options: ['ad_position', 'ad_source', 'scene', 'drama_id', 'channel', 'device_tier', 'city_tier', 'login_status', 'network'], req: true },
          { label: '操作符', key: 'op', type: 'select', options: ['=', '!=', 'in', 'not in', '>', '<'] },
          { label: '取值', key: 'v', value: 'rewarded', req: true, tip: '多个值用英文逗号分隔' }
        ],
        okText: '添加',
        onOk: v => { EV.filters.push({ p: v.p, op: v.op, v: v.v }); go('event'); Toast('过滤条件已应用，数据已重算'); }
      });
    });
    /* 对比事件 */
    const cadd = document.querySelector('[data-cmpadd]');
    if (cadd) cadd.addEventListener('click', () => {
      const list = D.eventTree.flatMap(g => g.items).slice(0, 40)
        .map(i => `<option value="${i.k}">${i.n} · ${i.k}</option>`).join('');
      Modal.open({
        title: '添加对比事件',
        body: `<div class="muted" style="font-size:12px;margin-bottom:10px">同时展示两条事件曲线，用于验证因果或先后关系。</div>`,
        fields: [{ label: '对比事件', key: 'k', type: 'select', options: D.eventTree.flatMap(g => g.items).slice(0, 40).map(i => i.k) }],
        okText: '添加对比',
        onOk: v => { EV.cmpK = v.k; EV.cmpN = evItem(v.k).n; EV.compare = true; go('event'); }
      });
    });
    document.querySelectorAll('[data-cmpdel]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (el.dataset.cmpdel === 'cmp') { EV.cmpK = null; EV.cmpN = null; EV.compare = false; }
        go('event');
      });
    });
    /* 查询按钮：计算过渡 */
    const qbBtn = $('#evQueryBtn');
    if (qbBtn) qbBtn.addEventListener('click', () => {
      const wrap = $('#evTrendWrap');
      if (!wrap) return;
      const mask = document.createElement('div');
      mask.className = 'calc-mask';
      mask.innerHTML = `<span class="spin"></span>查询中 · 扫描 ${Charts.fmt(B_scan())} 条事件…`;
      wrap.appendChild(mask);
      setTimeout(() => { go('event'); Toast('查询完成，已按当前条件重算'); }, 700);
    });
    /* 保存 / 导出 */
    const sv = $('#evSaveBtn');
    if (sv) sv.addEventListener('click', () => Modal.open({
      title: '保存为看板',
      fields: [{ label: '看板名称', key: 'n', value: `${EV.n} · ${EV_METRICS.find(m => m[0] === EV.metric)[1]}`, req: true },
      { label: '归属目录', key: 'd', type: 'select', options: ['我的看板', '投放分析', '变现分析', '团队共享'] }],
      okText: '保存',
      onOk: v => Toast(`已保存到「${v.d} / ${v.n}」`)
    }));
    const ex = $('#evExportBtn');
    if (ex) ex.addEventListener('click', () => {
      const rows = [['事件', '指标', '维度', '粒度', '数值']].concat(

   2. 漏斗分析
   =========================================================== */
const FN = window.FN = {
  key: 'full', win: 'd7', split: 'channel', order: 'ordered',
  chart: 'trapezoid', sel: 2, steps: null, loaded: null, trendStep: 2
};
const FN_WIN = { session: 0.82, same: 0.90, d1: 0.955, d7: 1 };
const FN_WIN_LABEL = { session: '会话内', same: '同日', d1: '1 天', d7: '7 天' };

function fnSteps() {
  if (FN.loaded !== FN.key || !FN.steps) {
    FN.steps = D.funnels[FN.key].steps.map(s => {
      const parts = s.name.split(' ');
      return { name: parts[0], key: parts[1] || '', full: s.name, value: s.value };
    });
    FN.loaded = FN.key;
    FN.sel = Math.min(2, FN.steps.length - 1);
    FN.trendStep = FN.sel;
  }
  return FN.steps;
}
function fnView() {
  const st = fnSteps();
  const w = FN_WIN[FN.win] || 1;
  const n = st.length;
  return st.map((s, i) => ({
    name: s.name,
    value: Math.max(1, Math.round(s.value * (1 - (1 - w) * i / Math.max(1, n - 1)) * (FN.order === 'unordered' ? 1 + 0.05 * i / n : 1)))
  }));
}
function fnScaleVals(vals) {
  const w = FN_WIN[FN.win] || 1, n = vals.length;
  return vals.map((v, i) => Math.round(v * (1 - (1 - w) * i / Math.max(1, n - 1))));
}
function fnBars(steps) {
  const max = steps[0].value;
  return `<div class="fbars">` + steps.map((s, i) => {
    const w = Math.max(5, s.value / max * 100);
    const conv = i ? s.value / steps[i - 1].value * 100 : 100;
    return `<div class="fbar-row ${FN.sel === i ? 'sel' : ''}" data-step="${i}">
      <span class="fi">${i + 1}</span>
      <span class="fn">${s.name}<em>${fnSteps()[i].key}</em></span>
      <span class="ft"><i style="width:${w.toFixed(1)}%"></i></span>
      <span class="fv">${Charts.fmt(s.value)}</span>
      <span class="fc ${i && conv < 60 ? 'bad' : ''}">${i ? conv.toFixed(1) + '%' : '—'}</span>
    </div>`;
  }).join('') + `</div>`;
}

    const f = D.funnels[FN.key];
    const steps = fnView();
    const first = steps[0].value, last = steps[steps.length - 1].value;

    steps.forEach((s, i) => {

/* ===========================================================
   3. 广告变现分析
   =========================================================== */
const MC = window.MC = { metric: 'ecpm', slot: '全部广告位', srcView: 'waterfall' };
const MC_METRICS = [
  ['ecpm', 'eCPM'], ['imp', '展示量'], ['rev', '广告收入'], ['fill', '填充率']
];

function mcTotals() {
  const rev = D.adSlots.reduce((s, x) => s + x.rev, 0);
  const imp = D.adSlots.reduce((s, x) => s + x.show, 0);
  const req = D.adSlots.reduce((s, x) => s + x.req, 0);
  const fill = D.adSlots.reduce((s, x) => s + x.fill, 0);
  return { rev, imp, req, fill };
}
function mcHourly() {
  const T = mcTotals();
  let imp, ecpm, fill;
  if (MC.slot === '全部广告位') {
    imp = D.hourly.labels.map((_, i) => D.adSlots.reduce((s, x) => s + (((D.hourlyBySlot || {})[x.name] || [])[i] || 0), 0));
    ecpm = D.hourly.ecpm.slice();
    fill = D.hourlyFill.slice();
  } else {
    const slot = D.adSlots.find(s => s.name === MC.slot) || D.adSlots[0];
    imp = (D.hourlyBySlot[slot.name] || D.hourly.imp).slice();
    const avgE = D.hourly.ecpm.reduce((a, b) => a + b, 0) / 24;
    ecpm = D.hourly.ecpm.map(v => +(slot.ecpm * v / avgE).toFixed(2));
    const baseFill = T.fill / T.req * 100;
    fill = D.hourlyFill.map(v => +((slot.fill / slot.req * 100) * v / baseFill).toFixed(1));
  }
  /* 归一：让分时收入合计等于总览收入，避免两处口径不一致 */
  const raw = imp.reduce((s, v, i) => s + v * ecpm[i] / 1000, 0);
  const k = raw ? T.rev / raw : 1;
  ecpm = ecpm.map(v => +(v * k).toFixed(2));
  const rev = imp.map((v, i) => Math.round(v * ecpm[i] / 1000));
  return { imp, ecpm, rev, fill };
}
function mcAll() {
  const save = MC.slot;
  MC.slot = '全部广告位';
  const r = mcHourly();
  MC.slot = save;
  return r;
}
function mcSeries() {
  const cur = mcHourly();
  const all = mcAll();
  return { cur: cur[MC.metric], base: all[MC.metric] };
}
